[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duck_analyzer"
version = "1.0.19"
description = "Streaming duck ID and anomaly detection, plus training and dataset prep"
requires-python = ">=3.8"
dependencies = [
     "mediapipe>=0.10.0",
    "ultralytics>=8.3.0",
    "opencv-python>=4.5.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pyyaml>=5.4.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "psutil>=5.9.0",
    "autodistill==0.1.29",
    "autodistill-grounding-dino",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["duck_analyzer*"]